services:
  hono-app:
    build: .
    container_name: firebase-fcm-api
    ports:
      - "92:3000"
    restart: always
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: >
      sh -c "bun install && bun run db:migrate && bun run dev"

networks:
  default:
    name: amiminn_network
    external: true
